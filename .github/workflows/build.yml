name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VER: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a ci.log
          node scripts/prepare.mjs "$VER" 2>&1 | tee -a ci.log
          npx tauri icon app-icon.svg -o src-tauri/icons 2>&1 | tail -3 | tee -a ci.log
          for f in ui/*.js; do node --check "$f" 2>&1 | tee -a ci.log; done

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --no-bundle 2>&1 | tee -a ci.log
          ls -la src-tauri/target/release/*.exe | tee -a ci.log

      - name: Smoke test
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Screenshots to the ci-shots branch
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p out && cp -r shots smoke.txt out/ 2>/dev/null || true
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -q -m "run ${{ github.run_number }}"
          git push -q -f origin ci-shots

      - name: Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DL_TOKEN }}
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then echo "no DL_TOKEN secret, skipping the release" | tee -a ci.log; exit 0; fi
          # one exe: named «…Setup…» it installs itself, any other name runs as the program (portable)
          cp src-tauri/target/release/retocker-snap.exe Retocker-Snap-Setup.exe
          cp src-tauri/target/release/retocker-snap.exe Retocker-Snap-portable.exe
          node scripts/sign.mjs Retocker-Snap-Setup.exe "$VER" "" latest.json
          cat latest.json | tee -a ci.log
          gh release create "v$VER" Retocker-Snap-Setup.exe Retocker-Snap-portable.exe latest.json \
            -R mishakozlov723-wq/retocker-snap-download \
            --title "Retocker Snap $VER" --notes-file RELEASE.md 2>&1 | tee -a ci.log

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: retocker-snap-${{ env.VER }}
          path: src-tauri/target/release/retocker-snap.exe
          retention-days: 14

      - name: Report a failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run ${{ github.run_number }} (${GITHUB_SHA::7}) failed. Last lines of the log:"; echo; echo '```'; tail -c 60000 ci.log 2>/dev/null | grep -v '^\s*Compiling ' | tail -n 400; echo '```'; } > issue.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file issue.md
